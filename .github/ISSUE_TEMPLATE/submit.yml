name: "➕ Submit a Slash Command"
description: "Add a slash command (Claude Code or other AI CLI) to the Slash Command Bazaar."
title: "[Command] /<name>"
labels: ["submission", "slash-command"]
body:
  - type: markdown
    attributes:
      value: "Thanks for contributing to **Slash Command Bazaar**! Attribution is mandatory."
  - type: input
    id: name
    attributes:
      label: Command name
      placeholder: "e.g. /commit"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source URL (or 'original')
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - git-version-control
        - code-review
        - testing
        - refactoring
        - documentation
        - debugging
        - devops-cicd
        - security
        - database
        - frontend
        - backend
        - project-management
        - ai-prompts
        - file-operations
        - productivity
        - misc
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Target tool
      options:
        - Claude Code
        - Cursor
        - Codex CLI
        - Gemini CLI
        - Any / generic
        - other
    validations:
      required: false
  - type: input
    id: author
    attributes:
      label: Author / credit
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: Original license
    validations:
      required: true
  - type: textarea
    id: body
    attributes:
      label: The command definition
      render: markdown
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I have provided the source and original license; this is properly attributed.
          required: true
        - label: Nominate this for the ⭐ Featured shelf (optional).
          required: false
